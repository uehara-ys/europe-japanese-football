    tally[k].g += p.g; tally[k].a += p.a;
  }));
  const hl = Object.values(tally).sort((x,y)=> (y.g*2+y.a)-(x.g*2+x.a) || y.g-x.g);
  document.getElementById("hl").innerHTML = hl.length ? hl.map(t =>
    `<span class="hl">${t.g?`<b>${t.g}G</b>`:""}${t.a?`<b class="a">${t.a}A</b>`:""}${esc(t.name)} <small>${esc(t.club)}</small></span>`).join("")
    : `<span class="note">この週のゴール・アシストはまだありません。</span>`;
  document.getElementById("hl-title").textContent = `${weekLabel(state.week)} のゴール・アシスト`;
  }
  const weekNav = () => { const i = weeks.indexOf(state.week); return `<div class="month-nav week-nav">
      <button class="mbtn" data-w="${weeks[i-1]||""}" ${i>0?"":"disabled"} aria-label="前の週">‹</button>
      <h2>${weekLabel(state.week)}</h2>
      <button class="mbtn" data-w="${weeks[i+1]||""}" ${i<weeks.length-1?"":"disabled"} aria-label="次の週">›</button>
      <span class="mcount">${matches.filter(inWeek).length}試合</span></div>`; };

  // チップ
  const chips = document.getElementById("chips");
  chips.innerHTML = COUNTRY.filter(([k]) => k==="ALL" || matches.some(m=>m.country===k) || fixtures.some(f=>f.country===k))
    .map(([k,l]) => `<button class="chip" data-c="${k}" aria-pressed="${state.country===k}">${l}</button>`).join("");
  chips.addEventListener("click", e => {
    const b = e.target.closest(".chip"); if(!b) return;
    state.country = b.dataset.c; save();
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.c===state.country));
    render();
  });
  document.getElementById("q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
  document.getElementById("playedOnly").addEventListener("change", e => { state.playedOnly = e.target.checked; render(); });
  const TABS = {matches:"tab-matches", fixtures:"tab-fixtures", players:"tab-players", ratings:"tab-ratings"};
  const setTab = t => {
    if(!TABS[t]) t = "matches";
    state.tab=t; save();
    Object.entries(TABS).forEach(([k,id]) => document.getElementById(id).setAttribute("aria-selected", k===t));
    document.getElementById("playedWrap").hidden = t==="fixtures" || t==="ratings";
    render();
  };
  Object.entries(TABS).forEach(([k,id]) => document.getElementById(id).onclick = () => setTab(k));

  const matchQ = (p, m) => !state.q || p.name.includes(state.q) || p.club.includes(state.q) || m.home.includes(state.q) || m.away.includes(state.q);
  const inCountry = m => state.country==="ALL" || m.country===state.country;

  function renderMatches(){
    const list = matches.filter(inWeek).filter(inCountry).map(m => {
      const ps = m.players.filter(p => matchQ(p,m) && (!state.playedOnly || played(p)));
      return ps.length ? {...m, shown:ps} : null;
    }).filter(Boolean);
    if(!list.length) return weekNav()+`<p class="empty">この週に条件に合う試合はありません。絞り込みを変えてみてください。</p>`;
    const byDate = {};
    list.forEach(m => (byDate[m.date] = byDate[m.date] || []).push(m));
    return weekNav() + Object.keys(byDate).sort().reverse().map(d => `
      <section class="day"><h3>${fmtDate(d)}</h3><div class="matches">
      ${byDate[d].map(m => {
        const jpClubs = new Set(m.players.map(p=>p.club));
        const clubsForRes = [...jpClubs];
        const res = clubsForRes.length===1 ? resultFor(m, clubsForRes[0]) : "";
        return `<article class="match">
          <div class="comp"><span>${esc(m.compName)} ${esc(m.round)}</span>${res?`<span class="res ${res}">${{W:"勝ち",D:"引き分け",L:"負け"}[res]}</span>`:""}</div>
          <div class="score"><span class="h ${jpClubs.has(m.home)?"jp":""}">${esc(m.home)}</span><span class="num">${m.hs} - ${m.as}</span><span class="${jpClubs.has(m.away)?"jp":""}">${esc(m.away)}</span></div>
          <div class="players">${m.shown.map(p => `<div class="p"><span class="name">${esc(p.name)}</span><span class="st ${p.st}">${stLabel(p)}</span>${p.g?`<span class="ga">${p.g}ゴール</span>`:""}${p.a?`<span class="ga a">${p.a}アシスト</span>`:""}${p.note?`<span class="note">${esc(p.note)}</span>`:""}${jpClubs.size>1?`<span class="club">${esc(p.club)}</span>`:""}${ratingsFor(m.date,p.name).filter(r=>r.score!=null).map(r=>`<span class="rchip ${scoreClass(r)}" title="${esc(r.outlet)}の採点">${esc(r.outlet)} ${r.score}</span>`).join("")}</div>`).join("")}</div>
        </article>`;}).join("")}
      </div></section>`).join("");
  }

  function renderFixtures(){
    if(!months.length) return `<p class="empty">今後の日程はまだ登録されていません。</p>`;
    const [y,mo] = state.month.split("-").map(Number);
    const q = state.q;
    const list = fixtures.filter(f => f.date.startsWith(state.month) && (state.country==="ALL" || f.country===state.country)
      && (!q || f.home.includes(q) || f.away.includes(q) || f.names.some(n => n.includes(q))));
    const byDate = {};
    list.forEach(f => (byDate[f.date] = byDate[f.date] || []).push(f));
    const sortT = t => (/^\d/.test(t) ? t.padStart(5,"0") : "99:99");
    Object.values(byDate).forEach(a => a.sort((x,z) => sortT(x.time).localeCompare(sortT(z.time))));

    const i = months.indexOf(state.month);
    const nav = `<div class="month-nav">
      <button class="mbtn" data-m="${months[i-1]||""}" ${i>0?"":"disabled"} aria-label="前の月">‹</button>
      <h2>${y}年${mo}月</h2>
      <button class="mbtn" data-m="${months[i+1]||""}" ${i<months.length-1?"":"disabled"} aria-label="次の月">›</button>
      <span class="mcount">${list.length}試合</span></div>`;

    const first = new Date(y, mo-1, 1).getDay(), days = new Date(y, mo, 0).getDate();
    let cells = WD.map((w,k) => `<div class="cal-h ${k===0?"sun":k===6?"sat":""}">${w}</div>`).join("");
    for(let k=0;k<first;k++) cells += `<div class="cal-c blank"></div>`;
    for(let d=1; d<=days; d++){
      const iso = `${state.month}-${pad(d)}`, n = (byDate[iso]||[]).length;
      const wd = (first+d-1)%7;
      cells += n ? `<button class="cal-c has ${iso===todayISO?"today":""} ${iso<todayISO?"past":""}" data-go="${iso}"><span class="dn ${wd===0?"sun":wd===6?"sat":""}">${d}</span><span class="cnt">${n}</span></button>`
                 : `<div class="cal-c ${iso===todayISO?"today":""}"><span class="dn ${wd===0?"sun":wd===6?"sat":""}">${d}</span></div>`;
    }
    const cal = `<div class="cal">${cells}</div>`;

    const body = Object.keys(byDate).sort().map(d => `
      <section class="day ${d<todayISO?"past":""}" id="d-${d}"><h3>${fmtDate(d)}${d===todayISO?` <span class="tag">今日</span>`:""}${d<todayISO?` <span class="tag muted">終了・結果は「試合結果」へ</span>`:""}</h3>
        <div class="fxs">${byDate[d].map(f => {
          const jh = !!rosters[f.home], ja = !!rosters[f.away];
          return `<div class="fx">
            <span class="time">${esc(f.time)}</span>
            <div class="fx-main">
              <div class="fx-teams"><span class="${jh?"jp":""}">${esc(f.home)}</span><span class="vs">vs</span><span class="${ja?"jp":""}">${esc(f.away)}</span></div>
              <div class="fx-sub"><span class="fx-comp">${esc(f.compName)} ${esc(f.round)}</span><span class="fx-names">${f.names.map(esc).join("・")}</span></div>
            </div></div>`;}).join("")}</div>
      </section>`).join("");
    return nav + cal + (list.length ? body : `<p class="empty">この月に条件に合う試合はありません。</p>`) +
      `<p class="note fx-foot">時刻は日本時間です。深夜のキックオフは前日の24時以降として表記しています（例：27:45 は翌朝3:45）。日程は変更されることがあります。</p>`;
  }

  // 選手ごとの所属リーグ（欧州カップ以外の最新の試合から）
  const leagueOf = {};
  [...matches].sort((a,b)=>a.date.localeCompare(b.date)).forEach(m => { if(m.country!=="EUR" && !/カップ|ポカール|コパ|タッサ/.test(m.compName)) m.players.forEach(p => { leagueOf[p.name] = {name:m.compName, country:m.country}; }); });
  const pviewSwitch = () => `<div class="seg" role="group" aria-label="集計範囲">
      <button class="segb" data-pv="period" aria-pressed="${state.pview==="period"}">週ごと</button>
      <button class="segb" data-pv="season" aria-pressed="${state.pview==="season"}">今シーズン通算</button></div>`;
  const sortRows = rows => { const {key,dir} = state.sort; return rows.sort((x,y) => {
      const xv = x[key] ?? -1, yv = y[key] ?? -1;
      const v = (typeof xv==="string") ? xv.localeCompare(yv,"ja") : xv-yv;
      return v*dir || ((y.g??0)-(x.g??0)) || ((y.apps??0)-(x.apps??0)); }); };
  const head = cols => { const {key,dir} = state.sort; return `<thead><tr>${cols.map(([k,l,n]) => `<th class="${n?"n":""}" data-k="${k}" aria-sort="${key===k?(dir>0?"ascending":"descending"):"none"}">${l}${key===k?(dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead>`; };

  function renderSeason(){
    const S = D.season; if(!S) return pviewSwitch()+`<p class="empty">通算データはまだありません。</p>`;
    const q = state.q;
    let rows = Object.entries(S.rows).map(([name,[apps,g,a]]) => {
      const lg = leagueOf[name] || {name:"",country:"OTH"};
      return {name, club:clubOf[name]||"", comp:lg.name, country:lg.country, apps, g, a, ga:g+a};
    }).filter(r => (state.country==="ALL" || state.country==="EUR" || r.country===state.country)
      && (!q || r.name.includes(q) || r.club.includes(q))
      && (!state.playedOnly || (r.apps||0)>0));
    if(!rows.length) return pviewSwitch()+`<p class="empty">条件に合う選手はいません。</p>`;
    sortRows(rows);
    const cols = [["name","選手",0],["comp","リーグ",0],["apps","出場",1],["g","ゴール",1],["a","アシスト",1],["ga","G+A",1]];
    return pviewSwitch() + `<div class="tablewrap"><table>${head(cols)}
      <tbody>${rows.map(r => `<tr><td><b>${esc(r.name)}</b><span class="club">${esc(r.club)}</span></td><td>${esc(r.comp)}</td><td class="n">${r.apps==null?"–":r.apps}</td><td class="n gcol">${r.g||""}</td><td class="n acol">${r.a||""}</td><td class="n">${r.ga||""}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">2026-27シーズンの${esc(S.basis)}の集計です（${S.asOf.replace(/-/g,"/")}時点、出典：<a href="${esc(S.source.url)}" target="_blank" rel="noopener">${esc(S.source.name)}</a>）。カップ戦・欧州カップ戦は含みません。「–」は出場記録のない選手です。見出しを押すと並べ替えできます。</p>`;
  }

  // 現地メディアの採点
  const ratings = (D.ratings||[]).map(r => ({date:r[0], name:r[1], outlet:r[2], country:r[3], score:r[4], scale:r[5], note:r[6], url:r[7], orig:r[8]!==false, kind:r[9]||"rating"}));
  const KIND = {rating:"採点", report:"試合レポート", article:"記事"};
  const KIND_ORDER = {rating:0, report:1, article:2};
  const ratingsFor = (date, name) => ratings.filter(r => r.date===date && r.name===name);
  const scoreClass = r => (r.scale==="10点満点" && r.score!=null) ? (r.score>=7?"hi":r.score<=5?"lo":"") : "";
  const scoreHTML = r => r.score==null ? `<span class="rs none k-${r.kind}">${r.kind==="rating"?"寸評":KIND[r.kind]||"記事"}</span>` : `<span class="rs ${scoreClass(r)}">${r.score}<small>${r.scale==="10点満点"?"/10":esc(r.scale)}</small></span>`;
  // 持ち主だけに出す「今すぐ採点を探す」ボタン（claude.ai 上でのみ動作）
  const RATING_TASK = "trig_01FYP3gBh5qRhy2xsoKLC6hB";
  const owner = {ready:false, mcp:null, msg:"", busy:false};
  (async () => {
    try{
      if(!window.claude || typeof window.claude.use !== "function") return;
      const [user, mcp] = await Promise.all([window.claude.use("user"), window.claude.use("mcp")]);
      const isOwner = user ? await user.isOwner() : false;
      if(!isOwner || !mcp) return;
      owner.ready = true; owner.mcp = mcp;
      if(state.tab === "ratings") render();
    }catch(e){}
  })();
  const lastFireKey = "kaigai-last-fire";
  const lastFire = () => { try{ return Number(localStorage.getItem(lastFireKey)||0); }catch(e){ return 0; } };
  async function fireRatingSearch(){
    if(owner.busy || !owner.mcp) return;
    owner.busy = true; owner.msg = "採点探しを依頼しています…"; render();
    try{
      await owner.mcp.callTool("Claude Code Remote", "fire_trigger", {trigger_id: RATING_TASK}, {cache:false});
      try{ localStorage.setItem(lastFireKey, String(Date.now())); }catch(e){}
      owner.msg = "採点探しを始めました。見つかった分は10〜20分ほどでこのページと公開サイトに反映されます（ページを開き直すと表示されます）。";
    }catch(err){
      const code = err && err.code;
      owner.msg = code==="needs_reauth" ? "Claude Code Remote の接続が切れています。claude.ai の設定 → コネクタから接続し直してください。"
        : code==="server_not_connected" ? "Claude Code Remote が接続されていません。claude.ai の設定 → コネクタで追加してください。"
        : (code==="not_in_manifest"||code==="approval_required") ? "このページからの実行が許可されていません。ページの権限メニューで Claude Code Remote を許可してから、もう一度押してください。"
        : code==="tool_error" ? `実行を依頼できませんでした（${err.message||"タスク側のエラー"}）。定期タスクの設定を確認してください。`
        : "実行を依頼できたか確認できませんでした。少し待ってからページを開き直し、反映されていなければもう一度押してください。";
    }finally{ owner.busy = false; render(); }
  }
  const ownerPanel = () => {
    if(!owner.ready) return "";
    const lf = lastFire(), mins = lf ? Math.round((Date.now()-lf)/60000) : null;
    return `<div class="owner"><button class="obtn" id="fire-ratings" ${owner.busy?"disabled":""}>今すぐ現地の評価を探す</button>
      <span class="note">あなたにだけ表示されています。${mins!=null?`前回の依頼は${mins<60?mins+"分":Math.round(mins/60)+"時間"}前。`:""}定期チェックは1日3回です。</span>
      ${owner.msg?`<p class="omsg">${esc(owner.msg)}</p>`:""}</div>`;
  };

  function renderRatings(){
    const q = state.q;
    const groups = {};
    ratings.forEach(r => {
      const m = matches.find(m => m.date===r.date && m.players.some(p => p.name===r.name));
      if(!m || m.week!==state.week || !inCountry(m)) return;
      const p = m.players.find(p => p.name===r.name);
      if(q && !(r.name.includes(q) || p.club.includes(q) || r.outlet.includes(q))) return;
      const k = r.date+"|"+r.name;
      (groups[k] = groups[k] || {m, p, list:[]}).list.push(r);
      groups[k].list.sort((a,b) => (KIND_ORDER[a.kind]??3)-(KIND_ORDER[b.kind]??3) || ((b.score!=null)-(a.score!=null)));
    });
    const gs = Object.values(groups).sort((a,b) => b.m.date.localeCompare(a.m.date) || a.p.name.localeCompare(b.p.name,"ja"));
    const intro = `<p class="note r-intro">海外の現地メディアが日本人選手をどう伝えたかをまとめています。採点のほか、試合レポートや通常の記事で取り上げられたものも載せています。点数の尺度は媒体ごとに異なります（表示は10点満点、数字が大きいほど高評価）。すべて海外メディアの元記事を直接確認したもので、日本語の報道は使っていません。内容は元記事の要点を短くまとめたもので、原文は「元記事を読む」から確認できます。</p>`;
    if(!gs.length) return ownerPanel() + weekNav() + intro + `<p class="empty">この週の現地の評価はまだ登録されていません。</p>`;
    return ownerPanel() + weekNav() + intro + `<div class="rlist">${gs.map(({m,p,list}) => {
      const res = resultFor(m, p.club);
      return `<article class="rcard">
        <header class="rhead">
          <div><span class="name">${esc(p.name)}</span> <span class="club">${esc(p.club)}</span></div>
          <div class="rmatch">${fmtDate(m.date)} ${esc(m.compName)}　${esc(m.home)} ${m.hs}-${m.as} ${esc(m.away)}${res?` <span class="res ${res}">${{W:"勝ち",D:"引き分け",L:"負け"}[res]}</span>`:""}</div>
          <div class="rstat">${stLabel(p)}${p.g?` <span class="ga">${p.g}ゴール</span>`:""}${p.a?` <span class="ga a">${p.a}アシスト</span>`:""}${p.note?` <span class="note">${esc(p.note)}</span>`:""}</div>
        </header>
        <ul class="rrows">${list.map(r => `<li>${scoreHTML(r)}<div class="rbody"><div class="rout">${esc(r.outlet)}${r.country?`<small>（${esc(r.country)}）</small>`:""}</div><div class="rnote">${esc(r.note)}</div>${r.orig?`<a class="rsrc" href="${esc(r.url)}" target="_blank" rel="noopener">元記事を読む</a>`:`<span class="rsrc unv">元記事は未確認・<a href="${esc(r.url)}" target="_blank" rel="noopener">日本語の報道</a>より</span>`}</div></li>`).join("")}</ul>
      </article>`;}).join("")}</div>`;
  }

  function renderPlayers(){
    if(state.pview==="season") return renderSeason();
    const agg = {};
    matches.filter(inWeek).filter(inCountry).forEach(m => m.players.forEach(p => {
      if(!matchQ(p,m)) return;
      const r = agg[p.name] = agg[p.name] || {name:p.name, club:p.club, comp:m.compName, apps:0, starts:0, mins:0, g:0, a:0, idle:0};
      if(played(p)){ r.apps++; if(p.st!=="U") r.starts++; r.mins += p.st==="F"?90 : p.st==="S"? p.min : Math.max(0, 90-p.min); }
      else r.idle++;
      r.g += p.g; r.a += p.a; r.club = p.club;
      if(m.country!=="EUR") r.comp = m.compName;
    }));
    let rows = Object.values(agg).filter(r => !state.playedOnly || r.apps>0);
    sortRows(rows);
    if(!rows.length) return pviewSwitch()+weekNav()+`<p class="empty">この週に条件に合う選手はいません。</p>`;
    const cols = [["name","選手",0],["comp","リーグ",0],["apps","出場",1],["starts","先発",1],["mins","出場時間(目安)",1],["g","ゴール",1],["a","アシスト",1],["idle","出場なし",1]];
    return pviewSwitch() + weekNav() + `<div class="tablewrap"><table>${head(cols)}
      <tbody>${rows.map(r => `<tr><td><b>${esc(r.name)}</b><span class="club">${esc(r.club)}</span></td><td>${esc(r.comp)}</td><td class="n">${r.apps}</td><td class="n">${r.starts}</td><td class="n">${r.mins}′</td><td class="n gcol">${r.g||""}</td><td class="n acol">${r.a||""}</td><td class="n">${r.idle||""}</td></tr>`).join("")}</tbody></table></div>
      <p class="note">出場時間は交代の分数から計算した目安です（アディショナルタイムは含みません）。見出しを押すと並べ替えできます。</p>`;
  }

  const view = document.getElementById("view");
  view.addEventListener("click", e => {
    const sb = e.target.closest(".segb[data-pv]");
    if(sb){ state.pview = sb.dataset.pv; save(); render(); return; }
    if(e.target.closest("#fire-ratings")){ fireRatingSearch(); return; }
    const wb = e.target.closest(".mbtn[data-w]");
    if(wb && wb.dataset.w){ state.week = wb.dataset.w; renderHL(); render(); return; }
    const mb = e.target.closest(".mbtn[data-m]");
    if(mb && mb.dataset.m){ state.month = mb.dataset.m; render(); return; }
    const go = e.target.closest("[data-go]");
    if(go){ const el = document.getElementById("d-"+go.dataset.go); if(el){
      const off = document.querySelector(".controls").offsetHeight + 8;
      window.scrollTo({top: el.getBoundingClientRect().top + window.scrollY - off, behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}); } return; }
    const th = e.target.closest("th[data-k]"); if(!th) return;
    const k = th.dataset.k;
    state.sort = state.sort.key===k ? {key:k, dir:-state.sort.dir} : {key:k, dir:(k==="name"||k==="comp")?1:-1};
    render();
  });
  function render(){ view.innerHTML = state.tab==="matches" ? renderMatches() : state.tab==="fixtures" ? renderFixtures() : state.tab==="ratings" ? renderRatings() : renderPlayers(); }

  document.getElementById("foot").innerHTML =
    `欧州のクラブに所属する日本人選手（男子）の公式戦を対象に、試合結果・日程・通算成績は1時間ごと、現地の評価は1日3回更新しています。出場状況は以下の情報をもとにまとめています：` +
    D.sources.map(s => ` <a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join("、") +
    `。親善試合・代表戦は含みません。`;

  renderHL();
  setTab(state.tab);
})();
</script>
</body>
</html>
